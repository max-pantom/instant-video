<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instant-video demo</title>
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font: 15px/1.5 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: #666; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #eee; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card b { position: absolute; left: 12px; bottom: 10px; z-index: 1; color: #fff; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.6); pointer-events: none; }
  code { background: #f3f3f5; padding: 1px 6px; border-radius: 6px; }
  #stat { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; border-radius: 10px; background: #111; color: #fff; font: 12px/1.4 ui-monospace, monospace; white-space: pre; }
</style>
</head>
<body>
<h1>instant-video</h1>
<p>Hover a card. The clip starts on a frame that is pixel-identical to the poster, so there is no flash and no loading state. Synthetic test patterns, encoded with <code>instant-video encode</code>.</p>
<div class="grid" id="grid"></div>
<div id="stat">hover a card</div>
<script type="module">
  import { configure } from '../dist/index.js'
  configure({ predict: true, prefetch: true })
  const ids = await (await fetch('assets/index.json')).json()
  const grid = document.getElementById('grid')
  const stat = document.getElementById('stat')
  for (const id of ids) {
    const iv = await (await fetch(`assets/${id}.json`)).json()
    const card = document.createElement('div')
    card.className = 'card'
    card.dataset.ivTarget = ''
    const img = new Image()
    img.src = iv.poster.jpg
    img.alt = id
    const label = document.createElement('b')
    label.textContent = id
    const v = document.createElement('instant-video')
    v.source = iv
    card.append(img, v, label)
    let t0 = 0
    card.addEventListener('pointerenter', () => { t0 = performance.now(); v.warmed = true; v.active = true })
    card.addEventListener('pointerleave', () => { v.active = false })
    v.addEventListener('playing', () => { stat.textContent = `${id}: playing ${Math.round(performance.now() - t0)} ms after pointer-enter` })
    grid.append(card)
  }
</script>
</body>
</html>
